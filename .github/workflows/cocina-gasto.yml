name: Cocina · presupuesto nacional

on:
  schedule:
    - cron: "0 13 * * *"   # todos los días, ~10:00 en Chile
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cocina-gasto
  cancel-in-progress: false

jobs:
  dipres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Procesar DIPRES (solo publica si pasan los controles)
        run: python cocina/dipres.py
      - name: Guardar resultados si cambiaron
        run: |
          git config user.name "cocina-codigopais"
          git config user.email "cocina@users.noreply.github.com"
          git add salida/
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos: presupuesto nacional actualizado ($(date -u +%Y-%m-%d))"
            git push
          fi
