name: Cocina · presupuesto nacional

on:
  schedule:
    - cron: "0 13 * * *"   # todos los días, ~10:00 en Chile
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cocina-gasto
  cancel-in-progress: false

jobs:
  dipres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Procesar DIPRES (solo publica si pasan los controles)
        run: python cocina/dipres.py
      - name: Guardar resultados si cambiaron
        run: |
          git config user.name "cocina-codigopais"
          git config user.email "cocina@users.noreply.github.com"
          # Si otra ejecución guardó datos mientras esta corría, se parte desde lo último de GitHub
          # y se agregan solo los resultados nuevos de salida/. Hasta 3 intentos.
          for intento in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main
            git add salida/
            if git diff --cached --quiet; then
              echo "Sin cambios en los datos."; exit 0
            fi
            git commit -m "Datos: presupuesto nacional actualizado ($(date -u +%Y-%m-%d))"
            if git push origin HEAD:main; then exit 0; fi
            echo "Choque con otra ejecución; reintento $intento"; sleep 10
          done
          exit 1
